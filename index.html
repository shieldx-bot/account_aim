    <!-- Google Tag Manager (telemetry destination for dataLayer events, incl. referral funnel).
         Replace GTM-XXXXXXX with the real container ID in production; without it trackEvent()
         still buffers to window.dataLayer and logs in DEV. -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        if (!i.startsWith('GTM-')) return; // skip placeholder injection
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-XXXXXXX');
    </script>
