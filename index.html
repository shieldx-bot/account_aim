<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logos/logo_aipro_favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090C" />
    <meta name="description" content="AIPro.dev - Official AI Pro license account distribution platform (Cursor Pro, Claude 3.7 Sonnet, ChatGPT Plus, GitHub Copilot). Instant delivery &lt; 30s, auto 1-for-1 warranty." />

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <title>AIPro.dev - AI Pro Account Platform for Developers</title>

    <!-- Google Tag Manager (telemetry destination for dataLayer events, incl. referral funnel).
         Replace GTM-XXXXXXX with the real container ID in production; without it trackEvent()
         still buffers to window.dataLayer and logs in DEV. -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        if (!i.startsWith('GTM-')) return; // skip placeholder injection
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-XXXXXXX');
    </script>
  </head>
  <body class="bg-[#08090C] text-[#F3F4F6] font-sans antialiased selection:bg-[#0066FF]/30 selection:text-[#00F0FF]">
    <!-- GTM noscript fallback -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
