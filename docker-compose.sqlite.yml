# AgentLab — SELF-CONTAINED stack (SQLite-style local database, no DB server)
#
#   docker compose -f docker-compose.sqlite.yml up -d
#
# The backend runs on PGlite: a real PostgreSQL engine compiled to WASM that
# runs inside the Node process and persists to a local data directory
# (volume agentlab_embedded_data). All app SQL/migrations work unchanged.
# Storefront: http://localhost:8080

services:
  backend:
    build:
      context: ./server
      network: host
    container_name: agentlab_backend
    restart: unless-stopped
    environment:
      # Self-contained LOCAL test stack: development mode so checkout/OTP work
      # without PayPal/Resend keys. Production deployments: use docker-compose.yml
      # with real keys + NODE_ENV=production.
      NODE_ENV: development
      DB_DRIVER: pglite
      PGDATA_DIR: /data/pglite
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_ROOT_KEY: ${ADMIN_ROOT_KEY:?set ADMIN_ROOT_KEY in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@agentlab.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MEMBER_PASSWORD: ${MEMBER_PASSWORD:-123456}
    volumes:
      - embedded_data:/data
    ports:
      - "127.0.0.1:5001:5000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      network: host
    container_name: agentlab_web
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  embedded_data:
    name: agentlab_embedded_data
