# http-context map: set $blog_render_bot=1 only when BOTH conditions hold —
# the user-agent is a known crawler AND the request path is /blog or /blog/*.
# PCRE lookaheads test the concatenated "$http_user_agent$uri" value; keep the
# alternation list in sync with CRAWLER_UA in server blog.controller.ts.
# Verified against real desktop/mobile Googlebot, bingbot, facebookexternalhit
# and twitterbot UAs on /blog and /blog/<slug> (all matched), while normal
# browsers and non-/blog paths stay 0.
map "$http_user_agent$uri" $blog_render_bot {
    default 0;
    "~*(?=.*(?:googlebot|google-inspectiontool|bingbot|yandex|baiduspider|duckduckbot|slurp|facebookexternalhit|twitterbot|linkedinbot|discordbot|slackbot|whatsapp|telegrambot|applebot|petalbot|semrushbot|ahrefsbot|mj12bot|bytespider|gptbot|claudebot|lighthouse|ia_archiver))(?=.*\/blog(?:\/.*)?$)" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed build assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy to the backend container
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Blog media uploaded through the backend — served with long cache
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Dynamic sitemap generated by the backend
    location = /sitemap.xml {
        proxy_pass http://backend:5000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Crawl policy generated by the backend (exact match wins over /blog below)
    location = /robots.txt {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blog RSS feed generated by the backend (exact match wins over /blog below)
    location = /blog/rss.xml {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /blog and /blog/* — humans get the SPA shell, crawlers are sent to the
    # backend /render endpoint which injects server-rendered meta + JSON-LD.
    location ^~ /blog {
        error_page 418 = @blog_crawler;
        if ($blog_render_bot) { return 418; }
        try_files $uri $uri/ /index.html;
    }

    # Named location: internal redirect target for crawler requests. The backend
    # reads X-Original-URI to know which page to render; it never sees the URI.
    # NB: proxy_pass may NOT carry a URI inside a named location (nginx refuses
    # to start), so rewrite to /render first and proxy without a URI. The '?'
    # in the replacement drops the query string; the original path travels in
    # the X-Original-URI header.
    location @blog_crawler {
        set $blog_original_uri $uri;
        rewrite ^ /render? break;
        proxy_set_header X-Original-URI $blog_original_uri;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — every unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
